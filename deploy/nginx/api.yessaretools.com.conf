# nginx reverse proxy for the Yessare API (api.yessaretools.com)
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.

upstream django {
    server web:8000;
}

# --- HTTP: ACME challenge + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.yessaretools.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.yessaretools.com;

    ssl_certificate     /etc/letsencrypt/live/api.yessaretools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yessaretools.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Large product spreadsheets / images
    client_max_body_size 50M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /static/ {
        alias /var/www/api/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/api/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
