# Bootstrap config — use this BEFORE you have TLS certificates.
# 1. docker compose up -d web nginx      (with this file mounted)
# 2. docker compose run --rm --entrypoint "certbot certonly --webroot \
#      -w /var/www/certbot -d api.yessaretools.com --email you@example.com \
#      --agree-tos --no-eff-email" nginx
# 3. Swap the mount to api.yessaretools.com.conf and: docker compose restart nginx

upstream django {
    server web:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yessaretools.com;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /var/www/api/static/;
        access_log off;
    }

    location /media/ {
        alias /var/www/api/media/;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
